[workspace]
resolver = "2"
members = [
    "crates/nex-lexer",
    "crates/nex-syntax",
    "crates/nex-driver",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/c4ist/nex"
rust-version = "1.83"

[workspace.dependencies]
nex-lexer = { path = "crates/nex-lexer" }
nex-syntax = { path = "crates/nex-syntax" }
# pinned to the newest releases that still build on our msrv (1.83). cargo only
# became msrv-aware in 1.84 so these have to be exact.
clap = { version = "=4.5.23", features = ["derive"] }
insta = "=1.41.1"
# pretty source-annotated diagnostics for the cli (step 3.11), replacing the
# hand-rolled renderer that stood in until the parser needed richer output.
ariadne = "=0.5.1"

[workspace.lints.clippy]
# threshold is in clippy.toml (cognitive-complexity-threshold = 20). warn
# here, not deny, so it composes with the `-D warnings` CI already runs
# rather than doubling up on the fail behavior in two places.
cognitive_complexity = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
